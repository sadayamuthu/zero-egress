name: Release

# Push a tag like v0.1.0 to build every installer and publish a GitHub Release
# with them, SHA256SUMS and a CycloneDX SBOM, then update the Homebrew cask in
# sadayamuthu/homebrew-tap. The tag must equal "v" + product.json
# zeroEgressVersion. A tag with a "-" (v0.2.0-rc.1) is published as a
# prerelease and does not touch the cask.
#
# Bump and release (bump-release.yml) also starts this workflow after a green
# CI on main, with publish=true on the new tag (GITHUB_TOKEN tag pushes do not
# re-fire on.push). That tag points at a release commit that is not on main.
#
# Before anything is published, smoke jobs install each package (silent Inno
# Setup on Windows, apt for the .deb), launch it behind a logging proxy and
# check the workbench, the guard and the egress verdict (smoke.mjs).
#
# Run it manually (Actions -> Release -> Run workflow) to build the installers
# and upload them as workflow artifacts (kept 7 days). Set publish=true to also
# create the GitHub Release (and Homebrew update) when running on a tag ref.
# The "platforms" input limits a manual run to some platforms.
#
# Artifacts (<v> = zeroEgressVersion; unsigned builds add "-unsigned" before
# the extension of the macOS and Windows files):
#   ZeroEgress-<v>-arm64.dmg, ZeroEgress-<v>-x64.dmg
#   ZeroEgress-<v>-x64-setup.exe (all users), ZeroEgress-<v>-x64-user-setup.exe
#   zero-egress_<v>_amd64.deb, zero-egress-<v>-1.x86_64.rpm,
#   ZeroEgress-<v>-x86_64.AppImage, zero-egress-<v>-linux-x64.tar.gz
#   SHA256SUMS, zero-egress-<v>.cdx.json, verify-egress-proof.mjs
#
# Secrets. All are optional; without them the builds are unsigned.
#   macOS signing and notarization (all six together):
#     APPLE_CERT_P12_BASE64   base64 of the "Developer ID Application" .p12
#     APPLE_CERT_PASSWORD     password of that .p12
#     APPLE_SIGNING_IDENTITY  e.g. "Developer ID Application: Name (TEAMID)"
#     APPLE_ID                Apple ID used for notarytool
#     APPLE_TEAM_ID           team ID
#     APPLE_APP_PASSWORD      app-specific password for that Apple ID
#   Windows signing, either Azure Trusted Signing (all six):
#     AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
#     AZURE_TS_ENDPOINT (e.g. https://eus.codesigning.azure.net/),
#     AZURE_TS_ACCOUNT, AZURE_TS_PROFILE
#   or an OV code-signing certificate:
#     WIN_CERT_PFX_BASE64     base64 of the .pfx
#     WIN_CERT_PASSWORD       password of that .pfx
#   Homebrew:
#     HOMEBREW_TAP_TOKEN      fine-grained token with Contents read/write on
#                             sadayamuthu/homebrew-tap only. Unset: the cask
#                             update is skipped with a warning.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated subset of mac-arm64,mac-x64,win,linux, or "all"'
        required: false
        default: all
        type: string
      publish:
        description: 'Publish a GitHub Release (and Homebrew cask) when this run is on a v*.*.* tag'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # Nothing here launches Electron from node_modules or a browser; the gulp
  # packaging step downloads its own Electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.plan.outputs.version }}
      mac: ${{ steps.plan.outputs.mac }}
      win: ${{ steps.plan.outputs.win }}
      linux: ${{ steps.plan.outputs.linux }}
      all: ${{ steps.plan.outputs.all }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Brand gate tests
        run: bash scripts/zero-egress/test/check-brand.test.sh
      - name: Brand gate
        run: bash scripts/zero-egress/check-brand.sh .
      - name: Defaults gate
        run: node scripts/zero-egress/check-defaults.mjs
      - name: Egress verdict tests
        run: node scripts/zero-egress/test/egress-verdict.test.mjs
      - name: Guard wiring check
        run: node scripts/zero-egress/test/guard-wiring.test.mjs
      - name: Version and platforms
        id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./product.json').zeroEgressVersion")"
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match product.json zeroEgressVersion ($version)"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          p="${PLATFORMS:-all}"
          [ "$p" = all ] && p="mac-arm64,mac-x64,win,linux"
          has() { [[ ",${p// /}," == *",$1,"* ]]; }
          for want in ${p//,/ }; do
            case "$want" in mac-arm64|mac-x64|win|linux) ;; *) echo "::error::Unknown platform '$want'"; exit 1;; esac
          done
          mac='[]'
          has mac-arm64 && mac=$(jq -c '. + [{"arch":"arm64","runner":"macos-14","watcher":"darwin-arm64"}]' <<<"$mac")
          has mac-x64 && mac=$(jq -c '. + [{"arch":"x64","runner":"macos-15-intel","watcher":"darwin-x64"}]' <<<"$mac")
          echo "mac=${mac}" >> "$GITHUB_OUTPUT"
          has win && echo "win=true" >> "$GITHUB_OUTPUT" || echo "win=false" >> "$GITHUB_OUTPUT"
          has linux && echo "linux=true" >> "$GITHUB_OUTPUT" || echo "linux=false" >> "$GITHUB_OUTPUT"
          if has mac-arm64 && has mac-x64 && has win && has linux; then all=true; else all=false; fi
          echo "all=${all}" >> "$GITHUB_OUTPUT"
          echo "version=${version} mac=${mac} platforms=${p} all=${all}"

  build-mac:
    needs: test
    if: needs.test.outputs.mac != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.mac) }}
    name: build-mac (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Signing secrets go only to the steps that use them, never to npm ci,
    # whose dependency install scripts would otherwise see them. Step
    # conditions test this boolean instead. npm ci does get the job's
    # GITHUB_TOKEN (contents: read on this public repository, expiring with
    # the job) for @vscode/ripgrep's download; see the Install step.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
        env:
          # Newer Apple clang rejects the consteval use in a bundled fmt.
          CXXFLAGS: -DFMT_CONSTEVAL=
          # @vscode/ripgrep's postinstall downloads from the GitHub API, which
          # rate-limits anonymous requests from shared runner IPs (403). Every
          # install script can read this token; it is read-only (permissions:
          # contents: read) and expires with the job, so it grants nothing a
          # public checkout does not.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Restore @parcel/watcher prebuild
        run: bash build/zero-egress/restore-parcel-watcher.sh ${{ matrix.watcher }}
      - name: Import signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 16)"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc"
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
      # Builds, runs the brand check and URL audit on the .app (a failure
      # ships nothing), signs and packages the dmg.
      - name: Build, gate and package
        run: bash build/zero-egress/build-mac.sh ${{ matrix.arch }}
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: mac-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-win:
    needs: test
    if: needs.test.outputs.win == 'true'
    # windows-latest now ships Visual Studio 2026, which node-gyp 10 (npm 10,
    # Node 20) cannot find; windows-2022 has Visual Studio 2022.
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    # As in build-mac: secrets reach only the steps that use them.
    env:
      HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' }}
      HAS_PFX: ${{ secrets.WIN_CERT_PFX_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}   # see build-mac
      - name: Restore @parcel/watcher prebuild
        run: bash build/zero-egress/restore-parcel-watcher.sh win32-x64
      - name: Signing mode
        env:
          WIN_CERT_PFX_BASE64: ${{ secrets.WIN_CERT_PFX_BASE64 }}
        run: |
          if [ "$HAS_AZURE" = true ] && [ "$HAS_PFX" = true ]; then
            echo "::warning::Both Azure Trusted Signing and WIN_CERT_PFX_BASE64 are configured; signing with Azure and ignoring the PFX"
          fi
          if [ "$HAS_AZURE" = true ]; then
            echo "ZE_WIN_SIGNED=1" >> "$GITHUB_ENV"
            echo "Signing with Azure Trusted Signing"
          elif [ "$HAS_PFX" = true ]; then
            echo "$WIN_CERT_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
            echo "WIN_CERT_PFX=$RUNNER_TEMP/cert.pfx" >> "$GITHUB_ENV"
            echo "Signing with the OV certificate (signtool)"
          else
            echo "No Windows signing secrets: building unsigned installers"
          fi
      # Builds the app and runs the brand check and URL audit on it (a failure
      # ships nothing). With WIN_CERT_PFX it also signs the app binaries.
      - name: Build and gate the app
        run: bash build/zero-egress/build-win.sh x64 app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - name: Sign the app binaries (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\..\VSCode-win32-x64
          files-folder-filter: exe,dll,node
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Build the installers
        run: bash build/zero-egress/build-win.sh x64 setup
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
      - name: Sign the installers (Azure Trusted Signing)
        if: env.HAS_AZURE == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TS_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TS_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Remove the certificate
        if: always()
        run: rm -f "$RUNNER_TEMP/cert.pfx"
      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  build-linux:
    needs: test
    if: needs.test.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # The build is tight in this runner's 7 GB of RAM (private repo),
      # and the root disk is too small for both the build and a swap file, so
      # drop preinstalled toolchains this job doesn't use, then add swap on the
      # roomier of / and /mnt (leaving 25 GB for the build).
      - name: Free disk space and add swap
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          avail() { df --output=avail -BG "$1" 2>/dev/null | tail -1 | tr -dc 0-9; }
          dir=/; [ -d /mnt ] && [ "$(avail /mnt)" -gt "$(avail /)" ] && dir=/mnt
          size=$(( $(avail "$dir") - 25 )); [ "$size" -gt 16 ] && size=16
          if [ "$size" -ge 4 ]; then
            sudo fallocate -l "${size}G" "$dir/swapfile-release"
            sudo chmod 600 "$dir/swapfile-release"
            sudo mkswap "$dir/swapfile-release"
            sudo swapon "$dir/swapfile-release"
          else
            echo "::warning::Not enough disk for extra swap"
          fi
          df -h / /mnt || true
          free -h
      # Native build prerequisites for VS Code's npm dependencies, plus the
      # .deb (dpkg-deb, fakeroot) and .rpm (rpmbuild) packaging tools.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev fakeroot dpkg rpm
      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ github.token }}   # see build-mac
      - name: Restore @parcel/watcher prebuild
        run: bash build/zero-egress/restore-parcel-watcher.sh linux-x64-glibc
      # Builds, runs the brand check and URL audit on the app (a failure ships
      # nothing), then packages .tar.gz, .deb, .rpm and .AppImage.
      - name: Build, gate and package
        run: bash build/zero-egress/build-linux.sh x64
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Smoke: install (where there is an installer), launch the packaged app with a
  # fresh profile behind the logging proxy, and check over CDP that the
  # workbench renders, that an unconfigured address is refused and logged by
  # the guard, and that only loopback reached the proxy, positive control
  # included (scripts/zero-egress/smoke.mjs). Node 22 for its global WebSocket.
  smoke-mac:
    needs: [test, build-mac]
    if: needs.test.outputs.mac != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.test.outputs.mac) }}
    name: smoke-mac (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: mac-${{ matrix.arch }}
          path: dist
      - name: Copy the app out of the dmg
        run: |
          set -euo pipefail
          dmg="$(ls dist/*.dmg)"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          cp -R "$mnt/ZeroEgress.app" "$RUNNER_TEMP/"
          hdiutil detach "$mnt"
          file "$RUNNER_TEMP/ZeroEgress.app/Contents/MacOS/ZeroEgress"
      - name: Launch smoke and egress check
        run: node scripts/zero-egress/smoke.mjs --app "$RUNNER_TEMP/ZeroEgress.app/Contents/MacOS/ZeroEgress" --out "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke/user-data/logs
          if-no-files-found: ignore
          retention-days: 7

  smoke-win:
    needs: [test, build-win]
    if: needs.test.outputs.win == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: win-x64
          path: dist
      # The user installer first (no admin), then the all-users one; each is
      # installed silently, launched, and uninstalled silently.
      - name: 'User installer: install, launch, uninstall'
        run: |
          set -euo pipefail
          setup="$(ls dist/ZeroEgress-*-x64-user-setup*.exe)"
          dir="$LOCALAPPDATA/Programs/ZeroEgress"
          powershell -NoProfile -Command "\$p = Start-Process -FilePath '$(cygpath -w "$setup")' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!runcode' -Wait -PassThru; exit \$p.ExitCode"
          test -f "$dir/ZeroEgress.exe"
          node scripts/zero-egress/smoke.mjs --app "$dir/ZeroEgress.exe" --out "$RUNNER_TEMP/smoke-user"
          powershell -NoProfile -Command "\$p = Start-Process -FilePath '$(cygpath -w "$dir/unins000.exe")' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru; exit \$p.ExitCode"
          for i in $(seq 1 30); do [ -f "$dir/ZeroEgress.exe" ] || break; sleep 2; done
          if [ -f "$dir/ZeroEgress.exe" ]; then echo "::error::the user uninstaller left ZeroEgress.exe behind"; exit 1; fi
      - name: 'All-users installer: install, launch, uninstall'
        run: |
          set -euo pipefail
          setup="$(ls dist/ZeroEgress-*-x64-setup*.exe | grep -v user-setup)"
          dir="$PROGRAMFILES/ZeroEgress"
          powershell -NoProfile -Command "\$p = Start-Process -FilePath '$(cygpath -w "$setup")' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/MERGETASKS=!runcode' -Wait -PassThru; exit \$p.ExitCode"
          test -f "$dir/ZeroEgress.exe"
          node scripts/zero-egress/smoke.mjs --app "$dir/ZeroEgress.exe" --out "$RUNNER_TEMP/smoke-system"
          powershell -NoProfile -Command "\$p = Start-Process -FilePath '$(cygpath -w "$dir/unins000.exe")' -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru; exit \$p.ExitCode"
          for i in $(seq 1 30); do [ -f "$dir/ZeroEgress.exe" ] || break; sleep 2; done
          if [ -f "$dir/ZeroEgress.exe" ]; then echo "::error::the all-users uninstaller left ZeroEgress.exe behind"; exit 1; fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-win-x64
          path: |
            ${{ runner.temp }}/smoke-user/user-data/logs
            ${{ runner.temp }}/smoke-system/user-data/logs
          if-no-files-found: ignore
          retention-days: 7

  # Also installs the .deb with apt and checks what it does to the system: no
  # apt repository or key added (the 0.1.0 .deb added Microsoft's), and
  # ZeroEgress package metadata and version in the .deb and the .rpm.
  smoke-linux:
    needs: [test, build-linux]
    if: needs.test.outputs.linux == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: linux-x64
          path: dist
      - name: Install the .deb and check its effect and metadata
        env:
          V: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          snapshot() { ls -la /etc/apt/sources.list.d /etc/apt/trusted.gpg.d /usr/share/keyrings 2>/dev/null | grep -v ' \.\.\?$' || true; }
          # The runner image ships its own packages.microsoft.com sources; only one the .deb adds is a failure.
          ms_sources() { grep -rhs 'packages.microsoft.com' /etc/apt/sources.list /etc/apt/sources.list.d | sort -u || true; }
          snapshot > "$RUNNER_TEMP/apt-before.txt"
          ms_sources > "$RUNNER_TEMP/ms-before.txt"
          sudo apt-get update
          sudo apt-get install -y xvfb rpm "./dist/zero-egress_${V}_amd64.deb"
          snapshot > "$RUNNER_TEMP/apt-after.txt"
          diff "$RUNNER_TEMP/apt-before.txt" "$RUNNER_TEMP/apt-after.txt" || { echo "::error::installing the .deb changed apt's sources or keys"; exit 1; }
          ms_sources > "$RUNNER_TEMP/ms-after.txt"
          if comm -13 "$RUNNER_TEMP/ms-before.txt" "$RUNNER_TEMP/ms-after.txt" | grep -q .; then echo "::error::installing the .deb added an apt source at packages.microsoft.com"; exit 1; fi
          dpkg-query -W -f='${Version}\n${Maintainer}\n${Homepage}\n' zero-egress | tee "$RUNNER_TEMP/deb-fields.txt"
          case "$(sed -n 1p "$RUNNER_TEMP/deb-fields.txt")" in "1:${V}-"*) ;; *) echo "::error::.deb version is not 1:${V}-<rev>"; exit 1;; esac
          grep -qx 'ZeroEgress <4604648+sadayamuthu@users.noreply.github.com>' "$RUNNER_TEMP/deb-fields.txt" || { echo "::error::.deb Maintainer is not ZeroEgress"; exit 1; }
          grep -qx 'https://github.com/sadayamuthu/zero-egress' "$RUNNER_TEMP/deb-fields.txt" || { echo "::error::.deb Homepage is not the repository"; exit 1; }
          rpm -qp --queryformat '%{EPOCH}:%{VERSION}\n%{VENDOR}\n%{URL}\n' "dist/zero-egress-${V}-1.x86_64.rpm" | tee "$RUNNER_TEMP/rpm-fields.txt"
          grep -qx "1:${V}" "$RUNNER_TEMP/rpm-fields.txt" || { echo "::error::.rpm version is not 1:${V}"; exit 1; }
          grep -qx 'ZeroEgress <4604648+sadayamuthu@users.noreply.github.com>' "$RUNNER_TEMP/rpm-fields.txt" || { echo "::error::.rpm Vendor is not ZeroEgress"; exit 1; }
          grep -qx 'https://github.com/sadayamuthu/zero-egress' "$RUNNER_TEMP/rpm-fields.txt" || { echo "::error::.rpm URL is not the repository"; exit 1; }
          if grep -rqiE 'microsoft\.com|visualstudio\.com' /usr/share/appdata/zero-egress.appdata.xml /usr/share/applications/zero-egress*.desktop; then echo "::error::installed metadata mentions a Microsoft host"; exit 1; fi
      - name: Launch smoke and egress check (installed .deb, under xvfb)
        run: xvfb-run -a node scripts/zero-egress/smoke.mjs --app /usr/share/zero-egress/zero-egress --out "$RUNNER_TEMP/smoke"
      - name: Remove the .deb
        run: |
          set -euo pipefail
          sudo apt-get remove -y zero-egress
          ls -la /etc/apt/sources.list.d /etc/apt/trusted.gpg.d /usr/share/keyrings 2>/dev/null | grep -v ' \.\.\?$' > "$RUNNER_TEMP/apt-removed.txt" || true
          diff "$RUNNER_TEMP/apt-before.txt" "$RUNNER_TEMP/apt-removed.txt" || { echo "::error::removing the .deb changed apt's sources or keys"; exit 1; }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-linux-x64
          path: ${{ runner.temp }}/smoke/user-data/logs
          if-no-files-found: ignore
          retention-days: 7

  # Checks every expected file is present and writes SHA256SUMS, the SBOM and
  # the rendered cask. Runs on manual runs too (when every platform was built)
  # so they are exercised before a tag; it publishes nothing.
  release-files:
    needs: [test, build-mac, build-win, build-linux, smoke-mac, smoke-win, smoke-linux]
    if: needs.test.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # No credentials on disk: the SBOM step runs a tool from npm.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Check the artifact names
        env:
          V: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          ls -la
          mac_suffix=""; [ -e "ZeroEgress-${V}-arm64-unsigned.dmg" ] && mac_suffix="-unsigned"
          win_suffix=""; [ -e "ZeroEgress-${V}-x64-setup-unsigned.exe" ] && win_suffix="-unsigned"
          expected=(
            "ZeroEgress-${V}-arm64${mac_suffix}.dmg"
            "ZeroEgress-${V}-x64${mac_suffix}.dmg"
            "ZeroEgress-${V}-x64-setup${win_suffix}.exe"
            "ZeroEgress-${V}-x64-user-setup${win_suffix}.exe"
            "zero-egress_${V}_amd64.deb"
            "zero-egress-${V}-1.x86_64.rpm"
            "ZeroEgress-${V}-x86_64.AppImage"
            "zero-egress-${V}-linux-x64.tar.gz"
          )
          missing=0
          for f in "${expected[@]}"; do [ -s "$f" ] || { echo "::error::missing $f"; missing=1; }; done
          [ "$(ls | wc -l)" -eq "${#expected[@]}" ] || { echo "::error::unexpected files in dist"; missing=1; }
          exit "$missing"
      # CycloneDX SBOM of the production npm dependency tree, from the root
      # lockfile. Not covered (README says so): the built-in extensions'
      # dependencies, Electron/Chromium and the bundled ripgrep.
      - name: SBOM
        env:
          V: ${{ needs.test.outputs.version }}
        run: |
          npx --yes @cyclonedx/cyclonedx-npm@6.0.1 --omit dev --package-lock-only \
            --output-format JSON --output-file "dist/zero-egress-${V}.cdx.json"
          node -e "const b=require('./dist/zero-egress-${V}.cdx.json'); console.log(b.bomFormat, b.specVersion, (b.components||[]).length + ' components')"
      # The standalone Egress Proof checker (Node built-ins only), so a
      # reviewer can verify a report without the source tree.
      - name: Egress Proof verify script
        run: |
          set -euo pipefail
          cp scripts/zero-egress/verify-egress-proof.mjs dist/
          # With no arguments it must load and exit 2 (usage).
          status=0; node dist/verify-egress-proof.mjs >/dev/null 2>&1 || status=$?
          [ "$status" -eq 2 ]
      - name: Checksums
        run: |
          cd dist
          # Covers the installers, the SBOM and the verify script.
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Render the Homebrew cask
        env:
          V: ${{ needs.test.outputs.version }}
        run: |
          set -euo pipefail
          suffix=""; [ -e "dist/ZeroEgress-${V}-arm64-unsigned.dmg" ] && suffix="-unsigned"
          arm=$(sha256sum "dist/ZeroEgress-${V}-arm64${suffix}.dmg" | cut -d' ' -f1)
          x64=$(sha256sum "dist/ZeroEgress-${V}-x64${suffix}.dmg" | cut -d' ' -f1)
          mkdir -p cask
          sed -e "s/@@VERSION@@/${V}/g" -e "s/@@SHA256_ARM64@@/${arm}/g" \
              -e "s/@@SHA256_X64@@/${x64}/g" -e "s/@@SUFFIX@@/${suffix}/g" \
              packaging/homebrew/zero-egress.rb.tmpl > cask/zero-egress.rb
          ! grep -n '@@' cask/zero-egress.rb
          cat cask/zero-egress.rb
      - uses: actions/upload-artifact@v7
        with:
          name: release-meta
          path: |
            dist/SHA256SUMS
            dist/zero-egress-*.cdx.json
            dist/verify-egress-proof.mjs
            cask/zero-egress.rb
          if-no-files-found: error
          retention-days: 7

  # Tag pushes always publish. workflow_dispatch publishes only when
  # publish=true (used by bump-release.yml); a plain manual run on a tag
  # still builds artifacts only.
  publish:
    needs: [test, release-files]
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: '{mac-*,win-*,linux-*}'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-meta
          path: meta
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cp meta/dist/* dist/
          (cd dist && sha256sum -c SHA256SUMS)
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          # Idempotent if bump-release re-runs after a partial publish.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --title "ZeroEgress ${TAG#v}" --generate-notes $prerelease
          fi

  # Updates Casks/zero-egress.rb in sadayamuthu/homebrew-tap. Skipped for
  # prereleases, and with a warning when HOMEBREW_TAP_TOKEN is unset.
  homebrew:
    needs: [publish]
    if: >
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The token reaches only the step that pushes; the others test this boolean.
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - name: Check for token
        if: env.HAS_TAP_TOKEN != 'true'
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew cask update."
      - uses: actions/download-artifact@v8
        if: env.HAS_TAP_TOKEN == 'true'
        with:
          name: release-meta
          path: meta
      - name: Update cask
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          TAG: ${{ github.ref_name }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/sadayamuthu/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp meta/cask/zero-egress.rb tap/Casks/zero-egress.rb
          cd tap
          git add Casks/zero-egress.rb
          git diff --cached --stat
          if git diff --cached --quiet; then echo "Cask already up to date"; exit 0; fi
          git -c user.name=ksadayamuthu -c user.email=ksadayamuthu@outlook.com \
            commit -m "zero-egress ${TAG#v}"
          git push
