<svg viewBox="0 0 372 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ZeroEgress">
  <!-- ZeroEgress wordmark: the logo.svg tile plus "ZeroEgress" ("Zero" bold) in the
       system sans-serif stack. Text is #e6edf3, for dark backgrounds. The tile
       below must stay identical to logo.svg (gen-icons.mjs checks this). -->
  <rect id="tile" width="96" height="96" rx="22" fill="#111827"/>
  <g id="mark">
    <path d="M16 40 a44 44 0 0 1 64 0" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" opacity=".3"/>
    <path d="M28 51 a28 28 0 0 1 40 0" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" opacity=".3"/>
    <ellipse cx="48" cy="70" rx="9" ry="12" fill="none" stroke="#34d399" stroke-width="5.5"/>
    <line x1="43" y1="78" x2="53" y2="62" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text id="wordmark-text" x="116" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="50" fill="#e6edf3"><tspan font-weight="700">Zero</tspan><tspan font-weight="400">Egress</tspan></text>
</svg>
